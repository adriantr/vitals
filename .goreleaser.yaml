version: 2

project_name: vitals

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./cmd/vitals
    binary: vitals
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  # release-please creates the release and its notes; goreleaser only attaches the assets.
  mode: keep-existing

changelog:
  disable: true
